services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://ubec_app:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy}@postgres:5432/ubec
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in Dokploy}
      REDIS_URL: redis://redis:6379
      # Address used in emailed links (password reset); never taken from the request.
      APP_URL: ${APP_URL:-https://ubec.byteflow.com.ng}
      # Outgoing email (lib/mailer.ts). Leave SMTP_HOST empty until a mailbox is ready; nothing is sent until then.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - frontend
      - backend

  # DNEMIS sync worker: same image as the app. Runs scheduled refreshes and "Sync now" jobs (lib/dnemis-jobs.ts).
  # Needs the frontend network for internet access to DNEMIS, and AUTH_SECRET to decrypt the saved token.
  # Answers in the app's place while a deploy swaps the app container (about 25 s), so saves made then wait and go through
  # instead of failing with the proxy's "404 page not found" (deploy/updating, lib/deploy-retry.ts). Its router has the
  # lowest priority: Traefik uses it only while the app has no route. Its image and config rarely change, so a deploy
  # leaves it running.
  updating:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/updating/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/updating/updating.html:/usr/share/nginx/html/updating.html:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.ubec-updating.rule=Host(`${APP_HOST:-ubec.byteflow.com.ng}`)
      - traefik.http.routers.ubec-updating.entrypoints=websecure
      - traefik.http.routers.ubec-updating.priority=1
      - traefik.http.routers.ubec-updating.tls.certresolver=letsencrypt
      - traefik.http.routers.ubec-updating.service=ubec-updating
      - traefik.http.services.ubec-updating.loadbalancer.server.port=80
    networks:
      - dokploy-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "worker/dnemis-worker.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ubec_app:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy}@postgres:5432/ubec
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in Dokploy}
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const t=Date.parse(require('fs').readFileSync('/tmp/dnemis-worker-alive','utf8'));process.exit(Date.now()-t<180000?0:1)"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - frontend
      - backend

  # Cache of per-state school lists and the DNEMIS job queue/lock. Internal only (no published port).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "300 1", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - ubec_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ubec
      POSTGRES_USER: ubec_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy}
    volumes:
      - ubec_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ubec_app -d ubec"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  migrate:
    build:
      context: .
      dockerfile: db/postgres/Dockerfile.migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://ubec_app:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy}@postgres:5432/ubec
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  provision:
    profiles:
      - tools
    build:
      context: .
      dockerfile: Dockerfile
      target: provision
    environment:
      DATABASE_URL: postgresql://ubec_app:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy}@postgres:5432/ubec
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend

volumes:
  ubec_postgres_data:
  ubec_redis_data:

networks:
  frontend:
  backend:
    internal: true
  dokploy-network:
    external: true
