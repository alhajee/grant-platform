<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="8">
<title>Updating · BEAPMS</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F4F2EE; color: #1f2a24;
    font: 16px/1.5 -apple-system, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 420px; margin: 16px; padding: 32px 28px; background: #fff; border: 1px solid #e0dfdc; border-radius: 16px; text-align: center; }
  .spin { width: 36px; height: 36px; margin: 0 auto 16px; border: 3px solid #d8e6dd; border-top-color: #0B4F3C; border-radius: 50%; animation: spin 0.9s linear infinite; }
  h1 { margin: 0 0 8px; font-size: 20px; color: #0B4F3C; }
  p { margin: 0; color: #5b6660; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>
</head>
<body>
<main>
  <div class="spin" aria-hidden="true"></div>
  <h1>BEAPMS is being updated</h1>
  <p>This takes less than a minute. The page will reload by itself, and nothing you saved is lost</p>
</main>
</body>
</html>
