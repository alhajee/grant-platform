# Answers for the portal while Dokploy swaps the app container on a deploy (about 25 s: migrations, then the new app).
# Traefik sends requests here only while the app has no route (this router has priority 1). API calls get JSON the
# portal's fetch wrapper recognises and sends again (lib/deploy-retry.ts); pages get a short page that reloads itself.
server {
  listen 80 default_server;
  add_header Cache-Control "no-store" always;
  add_header Retry-After "5" always;
  add_header X-Beapms-Updating "1" always;

  location /api/ {
    default_type application/json;
    return 503 '{"error":"The portal is being updated. Please try again in a minute","updating":true}';
  }
  location = /updating.html { internal; root /usr/share/nginx/html; }
  location / {
    error_page 503 /updating.html;
    return 503;
  }
}
